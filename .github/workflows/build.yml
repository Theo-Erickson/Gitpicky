# Builds Gitpicky installers for Windows, macOS and Linux.
#
# - Pull requests: run the tests on all three systems.
# - Every push to main: tests, then installers for all three systems,
#   downloadable from the run's Artifacts section (kept 14 days).
# - Push a version tag (e.g. v0.1.0): the same, plus a draft GitHub Release
#   with the installers attached, for you to review and publish.
# - "Run workflow" button in the Actions tab: build installers on demand.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Build installers
        if: github.event_name != 'pull_request'
        # The .deb package needs a homepage; use this repository's address so
        # nothing personal has to be written into package.json.
        run: npm run dist -- --publish never -c.extraMetadata.homepage=${{ github.server_url }}/${{ github.repository }}
        env:
          # No code-signing certificates yet; skip looking for them on macOS.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installers
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: gitpicky-${{ runner.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: installers/*
